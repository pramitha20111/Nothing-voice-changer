name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP
        run: unzip -o NothingVoiceChanger-Android-Project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK & SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.1.12297006"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APKs
        run: |
          gradle :app:assembleDebug :xposed-mic-hook:assembleDebug
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/NothingVoiceChanger-App.apk
          cp xposed-mic-hook/build/outputs/apk/debug/xposed-mic-hook-debug.apk release-apks/NothingVoiceChanger-VirtualMic-LSPosed.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: release-apks/*.apk
